<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>化學小測</title>
  <style>
    :root { --navy:#0b3a6e; --navy-2:#0e4a8c; --sky:#e8f1fb; --card:#fff; --ink:#1c2a3a; --muted:#5b6b7c; --line:#d5e0ea; --ok:#0f9d58; --ok-bg:#e8f8ef; --bad:#d93025; --bad-bg:#fdecea; --accent:#e67e22; --shadow:0 10px 30px rgba(11,58,110,.10); --wa:#128C7E; }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;background:linear-gradient(180deg,#dceaf8 0%,#f4f7fb 220px,#f4f7fb 100%);color:var(--ink);min-height:100vh}
    .wrap{max-width:860px;margin:0 auto;padding:20px 16px 48px}
    header.app{background:var(--navy);color:#fff;border-radius:18px;padding:18px 22px;box-shadow:var(--shadow);display:flex;justify-content:space-between;align-items:center;gap:12px}
    header.app h1{font-size:1.15rem}
    header.app p{opacity:.85;font-size:.86rem;margin-top:4px}
    .badge{background:var(--accent);color:#fff;font-weight:700;border-radius:999px;padding:6px 12px;font-size:.82rem}
    .card{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:22px;margin-top:16px;border:1px solid #e6eef6}
    label{display:block;font-weight:700;margin:12px 0 6px}
    select,input[type=password]{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;font-size:1rem;font-family:inherit}
    .btn{display:inline-flex;align-items:center;justify-content:center;border:0;cursor:pointer;font-family:inherit;font-weight:700;border-radius:12px;padding:12px 18px;font-size:1rem}
    .btn-primary{background:var(--navy);color:#fff;width:100%;margin-top:18px}
    .btn-ghost{background:#eef3f8;color:var(--navy)}
    .btn-wa{background:var(--wa);color:#fff;width:100%;margin-top:14px}
    .row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
    .hint{color:var(--muted);font-size:.9rem;margin-top:10px;line-height:1.5}
    .error{color:var(--bad);font-weight:700;margin-top:10px;min-height:1.2em}
    .progress-wrap{margin:16px 0 8px}
    .progress-meta{display:flex;justify-content:space-between;font-size:.9rem;color:var(--muted);margin-bottom:6px}
    .bar{height:10px;background:#e1eaf3;border-radius:99px;overflow:hidden}
    .bar>i{display:block;height:100%;background:linear-gradient(90deg,#1a73e8,#12b5c9);width:0}
    .section-tag{display:inline-block;background:var(--sky);color:var(--navy);font-weight:700;font-size:.78rem;padding:4px 10px;border-radius:999px;margin-bottom:10px}
    .q-title{font-size:1.12rem;line-height:1.65}
    .pictowrap{display:flex;justify-content:center;margin:16px 0 8px}
    .pictowrap img, img.qimg{max-width:260px;max-height:320px;object-fit:contain;border-radius:8px;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.08)}
    img.qimg.tall{max-height:380px}
    .options{display:grid;gap:10px;margin-top:16px}
    .opt{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:12px 14px;text-align:left;cursor:pointer;font-size:1rem;font-family:inherit}
    .opt.picked{border-color:var(--navy);background:#eaf2fb}
    .opt.correct{border-color:var(--ok);background:var(--ok-bg)}
    .opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
    .result-hero{text-align:center}
    .score-num{font-size:3.2rem;font-weight:800;color:var(--navy)}
    .score-num span{font-size:1.3rem;color:var(--muted)}
    .grid-5{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:14px}
    .chip{text-align:center;padding:8px 0;border-radius:10px;font-weight:700;background:#eef3f8}
    .chip.ok{background:var(--ok-bg);color:#0b7a43}
    .chip.no{background:var(--bad-bg);color:#a51f18}
    table{width:100%;border-collapse:collapse;font-size:.92rem}
    th,td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left}
    .hidden{display:none!important}
    .explain{margin-top:10px;background:#fff8e8;border:1px solid #f3dd9a;border-radius:12px;padding:10px 12px;font-size:.92rem}
    footer{text-align:center;color:var(--muted);font-size:.8rem;margin-top:22px}
    #feedback{margin-top:12px;border-radius:12px;padding:10px 12px;font-weight:700}
    #feedback.bad{background:var(--bad-bg);color:#a51f18}
    #feedback.ok{background:var(--ok-bg);color:#0b7a43}
    .need-all{margin-top:8px;font-size:.86rem;color:var(--accent);font-weight:700}
    #savedNote{margin-top:8px;color:#0b7a43;font-weight:700}
  </style>
</head>
<body>
  <div class="wrap">
    <header class="app">
      <div><h1>化學小測</h1><p>危險標籤 · 實驗儀器 · 純物質與混合物 · 空氣與氧氣 · 溶液</p></div>
      <div class="badge">全對才完成</div>
    </header>
    <section id="loginCard" class="card">
      <h2 style="margin-bottom:8px">學生登入</h2>
      <p class="hint">請選擇姓名，密碼是你的學號兩位數字（例如周卓元輸入 01）。完成後請用 WhatsApp 傳送結果。</p>
      <label for="nameSel">學生姓名</label>
      <select id="nameSel"><option value="">— 請選擇 —</option></select>
      <label for="pw">密碼（學號）</label>
      <input id="pw" type="password" inputmode="numeric" maxlength="2" autocomplete="off" placeholder="例如 01" />
      <p class="error" id="loginErr"></p>
      <button class="btn btn-primary" id="loginBtn">進入小測</button>
    </section>
    <section id="quizCard" class="card hidden">
      <div class="progress-wrap">
        <div class="progress-meta"><span id="who"></span><span id="progText">第 1 題</span></div>
        <div class="bar"><i id="barFill"></i></div>
      </div>
      <div class="section-tag" id="secTag"></div>
      <div class="q-title" id="qText"></div>
      <div class="pictowrap" id="picto"></div>
      <div class="options" id="opts"></div>
      <div id="feedback" class="hidden"></div>
      <div class="row"><button class="btn btn-primary" id="nextBtn" style="width:100%;margin-top:0">下一題</button></div>
    </section>
    <section id="resultCard" class="card hidden">
      <div class="result-hero">
        <div class="section-tag" id="doneTag">已完成（全對）</div>
        <div class="score-num" id="scoreNum">0<span> / ?</span></div>
        <p id="scoreMsg" class="hint"></p>
        <p class="need-all" id="tryInfo"></p>
        <p id="savedNote">成績已自動儲存。</p>
        <button class="btn btn-wa" id="waBtn">用 WhatsApp 傳送結果給老師</button>
      </div>
      <h3 style="margin-top:12px">分部表現</h3>
      <div id="sectionScores"></div>
      <h3 style="margin-top:18px">題號一覽</h3>
      <div class="grid-5" id="chipGrid"></div>
      <div class="row">
        <button class="btn btn-ghost" id="reviewBtn">逐題睇答案</button>
        <button class="btn btn-ghost" id="againBtn">返回登入</button>
      </div>
      <div id="reviewBox" class="hidden"></div>
      <hr style="margin:22px 0;border:0;border-top:1px solid var(--line)" />
      <details>
        <summary style="cursor:pointer;font-weight:700">老師功能（本機成績）</summary>
        <input id="teacherPw" type="password" placeholder="老師密碼" style="margin-top:8px" />
        <div class="row">
          <button class="btn btn-ghost" id="showRecBtn">顯示紀錄</button>
          <button class="btn btn-ghost" id="exportBtn">下載 CSV</button>
          <button class="btn btn-ghost" id="clearBtn">清除本機紀錄</button>
        </div>
        <div id="recBox"></div>
      </details>
    </section>
    <footer>課堂練習用途 · 有圖題已用齊你提供的標籤及儀器圖 · 全對才算完成</footer>
  </div>
  <script src="app.js?v=10"></script>
  <script src="img/corrosive.js?v=10"></script>
  <script src="img/explosive.js?v=10"></script>
  <script src="img/oxidizer.js?v=10"></script>
  <script src="img/harmful.js?v=10"></script>
  <script src="img/carcinogen.js?v=10"></script>
  <script src="img/burette.js?v=10"></script>
  <script src="img/burette_diagram.js?v=10"></script>
  <script src="img/crucible.js?v=10"></script>
  <script src="img/conical_flask.js?v=10"></script>
  <script src="img/separating_funnel.js?v=10"></script>
  <script src="questions.js?v=10"></script>
  <script src="logic.js?v=10"></script>
  <script src="pic-fix.js?v=10"></script>
</body>
</html>
